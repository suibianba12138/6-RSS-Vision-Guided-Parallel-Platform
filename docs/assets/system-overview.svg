<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">6-RSS vision-guided parallel platform architecture</title>
<desc id="desc">RealSense RGB-D sensing feeds two separate experimental paths: laser-target detection and black-rectangle detection. Each has its own Python controller. Both are documented to use the inverse-kinematics interface and serial ESP32 servo output.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#789096"/></marker>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#182228}
    .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:2px;fill:#187e7e;font-weight:700}
    .title{font-size:31px;font-weight:700;letter-spacing:-.7px}
    .sub{font-size:16px;fill:#64757c}
    .head{font-size:20px;font-weight:700}
    .detail{font-size:15px;fill:#53616d}
    .small{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.5px;fill:#187e7e}
    .node{fill:#fff;stroke:#d4dfe0;stroke-width:1.5}
    .accent{fill:#eaf6f3;stroke:#b7d8d2;stroke-width:1.5}
    .blue{fill:#eef4f8;stroke:#c8d9e4;stroke-width:1.5}
    .line{fill:none;stroke:#789096;stroke-width:2.2;marker-end:url(#arrow)}
    .rule{stroke:#e0e5e8;stroke-width:1}
  </style>
</defs>
<rect width="1280" height="590" fill="#fafafa"/>
<text x="48" y="54" class="eyebrow">SYSTEM ARCHITECTURE / SOURCE-LEVEL VIEW</text>
<text x="48" y="98" class="title">From RGB-D observations to embedded actuation</text>
<text x="48" y="128" class="sub">Two separate perception-controller experiments share the documented kinematic and servo interfaces.</text>
<rect x="48" y="218" width="220" height="150" rx="4" class="node"/>
<rect x="48" y="218" width="5" height="150" fill="#187e7e"/>
<text x="72" y="253" class="small">INPUT / 01</text>
<text x="72" y="288" class="head">RGB-D camera</text>
<text x="72" y="319" class="detail">RealSense color</text>
<text x="72" y="342" class="detail">and depth streams</text>
<path d="M268 293 H302 V190 H330" class="line"/>
<path d="M302 293 V405 H330" class="line"/>
<rect x="334" y="151" width="270" height="125" rx="4" class="blue"/>
<text x="356" y="181" class="small">ROUTE A / LASER TARGET</text>
<text x="356" y="215" class="head">Visual localization</text>
<text x="356" y="242" class="detail">HSV mask · contours · depth</text>
<text x="356" y="263" class="detail">vision2.py</text>
<rect x="334" y="343" width="270" height="125" rx="4" class="blue"/>
<text x="356" y="373" class="small">ROUTE B / BLACK RECTANGLE</text>
<text x="356" y="407" class="head">Shape extraction</text>
<text x="356" y="434" class="detail">Contour geometry · depth</text>
<text x="356" y="455" class="detail">visonblack.py</text>
<path d="M604 213 H640 V268 H672" class="line"/>
<path d="M604 405 H640 V320 H672" class="line"/>
<rect x="676" y="220" width="250" height="150" rx="4" class="accent"/>
<text x="698" y="251" class="small">PYTHON CONTROLLERS</text>
<text x="698" y="285" class="head">Pose / path command</text>
<text x="698" y="316" class="detail">shangweiji11.py</text>
<text x="698" y="340" class="detail">shangweijiblack4.py</text>
<path d="M926 295 H966" class="line"/>
<rect x="970" y="220" width="135" height="150" rx="4" class="node"/>
<text x="988" y="251" class="small">KINEMATICS</text>
<text x="988" y="285" class="head">InK6RSS</text>
<text x="988" y="316" class="detail">Native DLL</text>
<text x="988" y="340" class="detail">6 angles</text>
<path d="M1105 295 H1140" class="line"/>
<rect x="1144" y="220" width="88" height="150" rx="4" class="accent"/>
<text x="1157" y="251" class="small">OUTPUT</text>
<text x="1157" y="285" class="head">ESP32</text>
<text x="1157" y="316" class="detail">Serial</text>
<text x="1157" y="340" class="detail">6 servos</text>
<line x1="48" y1="516" x2="1232" y2="516" class="rule"/>
<text x="48" y="550" class="detail">Source documentation only · no claim of calibrated accuracy, repeatability or validated closed-loop performance.</text>
</svg>